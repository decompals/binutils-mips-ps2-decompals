name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.TARGET.OS }}
    strategy:
      fail-fast: false
      matrix:
        TARGET:
          - {
              NAME: 'linux',
              OS: 'ubuntu-22.04',
              NPROC: nproc,
              CONFIGURE_FLAGS: '',
              CFLAGS: '-O2 -static -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0',
              LDFLAGS: '',
              MAKEFLAGS: '',
              HOST: 'i386-pc-linux',
              ARCHIVE_NAME: 'binutils-mips-ps2-decompals-linux-x86-64.tar.gz',
            }
          - {
              NAME: 'mac',
              OS: 'macos-latest',
              NPROC: nproc,
              CONFIGURE_FLAGS: --with-system-zlib --with-gmp=/opt/homebrew/Cellar/gmp/6.3.0 --with-mpfr=/opt/homebrew/Cellar/mpfr/4.2.2,
              CFLAGS: '',
              LDFLAGS: '',
              MAKEFLAGS: '',
              HOST: 'aarch64-apple-darwin',
              ARCHIVE_NAME: 'binutils-mips-ps2-decompals-macos-arm64.tar.gz',
            }
          - {
              NAME: 'windows',
              OS: 'windows-latest',
              NPROC: nproc,
              CONFIGURE_FLAGS: --disable-gprof --disable-nls --without-zstd,
              CFLAGS: '-O2 -static -fno-stack-protector -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0',
              LDFLAGS: '-static -static-libgcc -static-libstdc++',
              MAKEFLAGS: 'MAKEINFO=true',
              HOST: 'x86_64-w64-mingw32',
              ARCHIVE_NAME: 'binutils-mips-ps2-decompals-windows-x86-64.zip',
            }

    name: Building binutils for ${{ matrix.TARGET.OS }} ${{ matrix.TARGET.HOST }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        shell: bash
        if: matrix.TARGET.NAME == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison libmpfr-dev

      - name: Install dependencies (macOS)
        shell: bash
        if: matrix.TARGET.NAME == 'mac'
        run: |
          brew update
          brew install bison texinfo

      - name: Install dependencies (Windows)
        uses: msys2/setup-msys2@v2
        if: matrix.TARGET.NAME == 'windows'
        with:
          msystem: MINGW64
          install: bison diffutils file flex gawk make patch perl texinfo zip
          pacboy: toolchain:p

      # Duplicated because GHA doesn't allow using shell from the matrix
      - name: Configure for mips
        shell: bash
        if: matrix.TARGET.NAME != 'windows'
        run: |
          ./configure --target=mips --prefix=/opt/cross --disable-gprofng --disable-gdb --disable-werror --host=${{ matrix.TARGET.HOST }} --build=${{ matrix.TARGET.HOST }} ${{ matrix.TARGET.CONFIGURE_FLAGS }}

      - name: Configure for mips (Windows)
        shell: msys2 {0}
        if: matrix.TARGET.NAME == 'windows'
        run: |
          ./configure --target=mips --prefix=/opt/cross --disable-gprofng --disable-gdb --disable-werror --host=${{ matrix.TARGET.HOST }} --build=${{ matrix.TARGET.HOST }} ${{ matrix.TARGET.CONFIGURE_FLAGS }}

      - name: Make
        shell: bash
        if: matrix.TARGET.NAME != 'windows'
        run: |
          make -j $(${{ matrix.TARGET.NPROC }}) CFLAGS="${{ matrix.TARGET.CFLAGS }}" LDFLAGS="${{ matrix.TARGET.LDFLAGS }}" ${{ matrix.TARGET.MAKEFLAGS }}

      - name: Make
        shell: msys2 {0}
        if: matrix.TARGET.NAME == 'windows'
        run: |
          make -j $(${{ matrix.TARGET.NPROC }}) CFLAGS="${{ matrix.TARGET.CFLAGS }}" LDFLAGS="${{ matrix.TARGET.LDFLAGS }}" ${{ matrix.TARGET.MAKEFLAGS }}

      - name: Test for file
        shell: bash
        if: matrix.TARGET.NAME != 'windows'
        run: |
          test -f binutils/ar
          file binutils/ar

      - name: Test for file (Windows)
        shell: msys2 {0}
        if: matrix.TARGET.NAME == 'windows'
        run: |
          test -f binutils/ar.exe
          file binutils/ar.exe

      - name: Create release archive
        shell: bash
        if: matrix.TARGET.NAME != 'windows'
        run: |
          mkdir -p release
          cp binutils/addr2line release/mips-ps2-decompals-addr2line
          cp binutils/ar        release/mips-ps2-decompals-ar
          cp gas/as-new         release/mips-ps2-decompals-as
          cp binutils/cxxfilt   release/mips-ps2-decompals-c++filt
          cp binutils/elfedit   release/mips-ps2-decompals-elfedit
          cp ld/ld-new          release/mips-ps2-decompals-ld
          cp binutils/nm-new    release/mips-ps2-decompals-nm
          cp binutils/objcopy   release/mips-ps2-decompals-objcopy
          cp binutils/objdump   release/mips-ps2-decompals-objdump
          cp binutils/ranlib    release/mips-ps2-decompals-ranlib
          cp binutils/readelf   release/mips-ps2-decompals-readelf
          cp binutils/size      release/mips-ps2-decompals-size
          cp binutils/strings   release/mips-ps2-decompals-strings
          cp binutils/strip-new release/mips-ps2-decompals-strip
          strip release/*
          chmod +x release/*
          cd release && tar -czf ../${{ matrix.TARGET.ARCHIVE_NAME }} *

      - name: Create release archive (Windows)
        shell: msys2 {0}
        if: matrix.TARGET.NAME == 'windows'
        run: |
          mkdir -p release
          cp binutils/addr2line.exe release/mips-ps2-decompals-addr2line.exe
          cp binutils/ar.exe        release/mips-ps2-decompals-ar.exe
          cp gas/as-new.exe         release/mips-ps2-decompals-as.exe
          cp binutils/cxxfilt.exe   release/mips-ps2-decompals-c++filt.exe
          cp binutils/elfedit.exe   release/mips-ps2-decompals-elfedit.exe
          cp ld/ld-new.exe          release/mips-ps2-decompals-ld.exe
          cp binutils/nm-new.exe    release/mips-ps2-decompals-nm.exe
          cp binutils/objcopy.exe   release/mips-ps2-decompals-objcopy.exe
          cp binutils/objdump.exe   release/mips-ps2-decompals-objdump.exe
          cp binutils/ranlib.exe    release/mips-ps2-decompals-ranlib.exe
          cp binutils/readelf.exe   release/mips-ps2-decompals-readelf.exe
          cp binutils/size.exe      release/mips-ps2-decompals-size.exe
          cp binutils/strings.exe   release/mips-ps2-decompals-strings.exe
          cp binutils/strip-new.exe release/mips-ps2-decompals-strip.exe
          strip release/*
          cd release && zip -9 ../${{ matrix.TARGET.ARCHIVE_NAME }} *

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: binutils-mips-ps2-decompals-${{ matrix.TARGET.NAME }}-${{ matrix.TARGET.HOST }}
          path: |
            ${{ matrix.TARGET.ARCHIVE_NAME }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.TARGET.ARCHIVE_NAME }}
